<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Shield Shape -->
  <path d="M256 80 L384 140 V256 C384 344 328 416 256 448 C184 416 128 344 128 256 V140 Z" 
        fill="none" stroke="url(#vGrad)" stroke-width="24" stroke-linejoin="round"/>

  <!-- Stylized "V" Monogram -->
  <path d="M192 192 L256 352 L320 192" 
        fill="none" stroke="url(#vGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Core Decision Gold Star Point -->
  <polygon points="256,125 266,148 290,148 270,163 277,185 256,170 235,185 242,163 222,148 246,148" fill="url(#goldGrad)"/>

  <!-- Taxonomy Brackets -->
  <path d="M100 210 L75 210 L75 302 L100 302" fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M412 210 L437 210 L437 302 L412 302" fill="none" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
